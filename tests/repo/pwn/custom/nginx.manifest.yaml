apiVersion: v1
kind: Namespace
metadata:
  name: not-the-normal-namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: not-the-normal-namespace
  name: custom-nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: not-the-normal-namespace
  name: custom-nginx-service
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: not-the-normal-namespace
  name: custom-nginx-ingress
  labels:
    app: nginx
spec:
  rules:
  - host: my-custom-nginx.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: custom-nginx-service
            port:
              number: 80
