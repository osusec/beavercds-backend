# compose to create registry container and ui to see if images pushed ok
services:
  registry-server:
    image: registry
    ports:
      - 5000:5000

  registry-ui:
    image: joxit/docker-registry-ui
    ports:
      - 5001:80
    user: root
    environment:
      - SINGLE_REGISTRY=true
      - NGINX_PROXY_PASS_URL=http://registry-server:5000

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ':9001'
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: notsecure

  # minio image does not set up default buckets or permissions from envvars, so
  # use sidecar image to set up test bucket and allow public downloads
  createbuckets:
    image: quay.io/minio/minio
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -xec "
        while ! curl --silent http://minio:9001 > /dev/null ; do sleep 1 ; done;
        /usr/bin/mc alias set myminio http://minio:9000 testuser notsecure;
        /usr/bin/mc mb myminio/testbucket;
        /usr/bin/mc anonymous set download myminio/testbucket;
        exit 0;
      "

  mock-frontend:
    image: ghcr.io/astral-sh/uv:alpine
    command: uvx flask --app mock_frontend run --host 0.0.0.0 --port 8080
    working_dir: /app
    ports:
      - 8080:8080
    configs:
      - source: mock_frontend.py
        target: /app/mock_frontend.py

configs:
  mock_frontend.py:
    content: |
      from flask import Flask, request

      app = Flask(__name__)

      @app.before_request
      def log_request():
          print(f"{request.method} {request.full_path} : {request.get_data().decode()}", flush=True)

      @app.get("/api/checkaccess")
      def checkaccess():
          return {"status":"ok"}

      @app.post("/api/resolvestate")
      def resolvestate():
          return {"current":[],"removed":[]}

      @app.post("/api/updatebrackets")
      def updatebrackets():
          return {"current":[],"removed":[]}
